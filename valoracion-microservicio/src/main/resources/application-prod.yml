spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/valoracion_prod
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

server:
  port: 8083

logging:
  level:
    evaluacion2.valoracion: WARN
