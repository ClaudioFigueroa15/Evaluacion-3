spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

genero:
  service:
    url: ${GENERO_SERVICE_URL:http://localhost:8082/api/v1/generos}

valoracion:
  service:
    url: ${VALORACION_SERVICE_URL:http://localhost:8083/api/v1/valoraciones}

server:
  port: ${PORT:8080}

logging:
  level:
    evaluacion3.pelicula: WARN
