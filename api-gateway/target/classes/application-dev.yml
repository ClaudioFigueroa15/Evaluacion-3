spring:
  cloud:
    gateway:
      routes:
        - id: pelicula-microservicio
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/peliculas/**
        - id: genero-microservicio
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/generos/**
        - id: valoracion-microservicio
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/valoraciones/**
        - id: usuario-microservicio
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/usuarios/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

server:
  port: 8080
