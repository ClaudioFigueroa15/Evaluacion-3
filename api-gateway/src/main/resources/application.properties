spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.routes[0].id=pelicula-microservicio
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/peliculas/**

spring.cloud.gateway.routes[1].id=genero-microservicio
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/generos/**

spring.cloud.gateway.routes[2].id=valoracion-microservicio
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/valoraciones/**

spring.cloud.gateway.routes[3].id=usuario-microservicio
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/usuarios/**
