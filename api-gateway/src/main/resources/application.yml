spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: pelicula-microservicio
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/peliculas/**
        - id: genero-microservicio
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/generos/**
        - id: valoracion-microservicio
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/valoraciones/**
        - id: usuario-microservicio
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/usuarios/**
        - id: subscription-microservicio
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/subscriptions/**
        - id: watch-history-microservicio
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/watch-history/**
        - id: favorites-microservicio
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/favorites/**
        - id: search-microservicio
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/search/**
        - id: notification-microservicio
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/notifications/**

server:
  port: 8080
