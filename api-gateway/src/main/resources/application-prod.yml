spring:
  cloud:
    gateway:
      routes:
        - id: pelicula-microservicio
          uri: ${PELICULA_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/peliculas/**
        - id: genero-microservicio
          uri: ${GENERO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/generos/**
        - id: valoracion-microservicio
          uri: ${VALORACION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/valoraciones/**
        - id: usuario-microservicio
          uri: ${USUARIO_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/usuarios/**
        - id: subscription-microservicio
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/subscriptions/**
        - id: watch-history-microservicio
          uri: ${WATCH_HISTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/watch-history/**
        - id: favorites-microservicio
          uri: ${FAVORITES_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/favorites/**
        - id: search-microservicio
          uri: ${SEARCH_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/search/**
        - id: notification-microservicio
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/notifications/**

logging:
  level:
    org.springframework.cloud.gateway: WARN

server:
  port: ${PORT:8080}
